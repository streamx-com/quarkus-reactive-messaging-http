mp.messaging.outgoing.my-http-sink.connector=quarkus-http
mp.messaging.outgoing.my-http-sink.url=http://localhost:${quarkus.http.test-port:8081}/processing-endpoint
mp.messaging.outgoing.my-http-sink.method=POST
mp.messaging.outgoing.my-http-sink.protocolVersion=HTTP_2
mp.messaging.outgoing.my-http-sink.twoPhaseResponseFlow=true

#Set to 1000 to handle all requests sent by HttpProcessingEndpoint during tests of HttpSinkProcessingTest
quarkus.thread-pool.max-threads=1000